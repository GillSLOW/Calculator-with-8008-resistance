name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build signed release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk StealthCalc-1.0.$N.apk
          gh release create "v1.0.$N" "StealthCalc-1.0.$N.apk" \
            --title "StealthCalc 1.0.$N" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download the .apk on your phone and tap it to install." \
            --latest
