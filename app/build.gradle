plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProps = new Properties()
def signingFile = rootProject.file('keystore/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.hotscan.calc'
    compileSdk 34

    defaultConfig {
        applicationId "com.hotscan.calc"
        minSdk 24
        targetSdk 34
        // CI sets BUILD_NUMBER so each GitHub build installs as an update
        versionCode((System.getenv("BUILD_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("BUILD_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
